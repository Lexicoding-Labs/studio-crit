<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title description">
<title id="title">Studio Crit in motion</title>
<desc id="description">Eleven illustrated design tools gather around a website proof. Their marks collect into three ranked actions on one sheet. A human hand and an agent gripper receive the completed plan.</desc>
<defs>
  <pattern id="paper" width="37" height="41" patternUnits="userSpaceOnUse"><path d="m3 6 1 .3m11 18 .9 -.4m15 12 .9 .2M34 8h.8" stroke="#766a50" stroke-width=".9" opacity=".24"/></pattern>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(29)"><path d="M0 0v7" stroke="#202b2a" stroke-width="1.6"/></pattern>
  <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#f6eedb"/></pattern>
  <clipPath id="poster"><path d="M-8 -63h156v138H-8z"/></clipPath>
  <style>
    .outline {stroke:#232a26;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
    .inkline {fill:none;stroke:#232a26;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
    .fine {fill:none;stroke:#232a26;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
    .review,.tool,.trace,.slip {opacity:0}
    .plan,.priority,.human,.machine {opacity:1}
    @media(prefers-reduced-motion:no-preference){
      .review,.tool,.trace,.slip,.plan,.priority,.human,.machine,.upperJaw,.lowerJaw,.glint {
        animation-duration:9.6s;animation-iteration-count:infinite;animation-fill-mode:both;
        animation-timing-function:cubic-bezier(.4,0,.2,1);
      }
      .review {animation-name:proof}
      .tool {animation-name:work}
      .trace {animation-name:draw}
      .slip {animation-name:gather}
      .plan {animation-name:turn}
      .priority {animation-name:rank}
      .human {animation-name:reach}
      .machine {animation-name:grip}
      .upperJaw {animation-name:pinchTop}.lowerJaw {animation-name:pinchBottom}
      .glint {animation-name:shine}
    }
    @keyframes proof {
      0%{opacity:1;transform:translateY(8px) rotate(-6deg) scale(.96)}
      9%,37%{opacity:1;transform:translateY(0) rotate(-3deg) scale(1)}
      49%{opacity:1;transform:translateY(1px) rotate(2deg) scale(.025,.95)}
      50%,95%{opacity:0;transform:scale(.025,.95)}
      100%{opacity:1;transform:translateY(8px) rotate(-6deg) scale(.96)}
    }
    @keyframes work {
      0%{opacity:0;transform:translate(var(--outer-x),var(--outer-y)) rotate(var(--tilt)) scale(.8)}
      8%{opacity:1;transform:translate(0,0) rotate(0deg)}
      19%{opacity:1;transform:translate(var(--in-x),var(--in-y)) rotate(var(--tilt))}
      29%{opacity:1;transform:translate(0,0) rotate(0deg)}
      37%{opacity:1;transform:translate(var(--in-x),var(--in-y)) rotate(var(--tilt))}
      47%,100%{opacity:0;transform:translate(var(--outer-x),var(--outer-y)) rotate(var(--tilt)) scale(.65)}
    }
    @keyframes draw {0%,15%{opacity:0;stroke-dashoffset:190}30%,41%{opacity:1;stroke-dashoffset:0}48%,100%{opacity:0;stroke-dashoffset:0}}
    @keyframes gather {
      0%,32%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.3)}
      37%{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}
      47%{opacity:1;transform:translate(var(--mx),var(--my)) rotate(18deg) scale(.85)}
      59%{opacity:1;transform:translate(0,var(--to)) rotate(0deg) scale(.65)}
      63%,100%{opacity:0;transform:translate(0,var(--to)) scale(.3)}
    }
    @keyframes turn {
      0%,48%{opacity:0;transform:rotate(2deg) scale(.025,.95)}
      49%{opacity:1;transform:rotate(2deg) scale(.025,.95)}
      61%{opacity:1;transform:translateY(-5px) rotate(3deg) scale(1.04)}
      70%,92%{opacity:1;transform:translateY(0) rotate(-2deg) scale(1)}
      98%,100%{opacity:0;transform:translateY(30px) rotate(3deg) scale(.96)}
    }
    @keyframes rank {0%,54%{opacity:0;transform:translate(30px,-15px)}66%,100%{opacity:1;transform:translate(0,0)}}
    @keyframes reach {0%,57%{opacity:0;transform:translate(-260px,110px) rotate(-10deg)}70%{opacity:1;transform:translate(-6px,5px) rotate(-1deg)}78%,92%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(-95px,76px)}}
    @keyframes grip {0%,59%{opacity:0;transform:translate(230px,-62px) rotate(7deg)}76%,92%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(140px,-40px)}}
    @keyframes pinchTop {0%,68%{transform:translate(6px,-17px)}78%,100%{transform:translate(0,0)}}
    @keyframes pinchBottom {0%,68%{transform:translate(6px,20px)}78%,100%{transform:translate(0,0)}}
    @keyframes shine {0%,76%{opacity:0;transform:scale(.1)}81%{opacity:1;transform:scale(1.15)}86%,100%{opacity:0;transform:scale(.1)}}
  </style>
</defs>
