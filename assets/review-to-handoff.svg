<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="638" viewBox="0 0 1100 638" role="img" aria-labelledby="title desc">
<title id="title">Studio Crit — eleven specialists, one prioritized improvement plan</title>
<desc id="desc">Nine specialists review a website. The Creative Director resolves their findings. The Creative Producer hands one prioritized plan with owners and acceptance checks to you and your agents.</desc>
<defs><clipPath id="poster"><rect x="261" y="84" width="165" height="116"/></clipPath></defs>
<style>
    .sans {font-family:Arial,Helvetica,sans-serif}
    .serif {font-family:Georgia,"Times New Roman",serif}
    .mono {font-family:"Courier New",monospace}
    text {fill:#262b24} .light {fill:#fffef4}
    @media (prefers-reduced-motion:no-preference){
      .pin {animation:arrive .48s cubic-bezier(.22,.75,.25,1) backwards; transform-box:fill-box}
      .route {animation:ink .36s 1.65s backwards}
      .rank {animation:rank .42s cubic-bezier(.2,.76,.3,1) backwards}
      .row0 {animation-delay:2.15s}.row1 {animation-delay:2.45s}.row2 {animation-delay:2.75s}
      .detail {animation:ink .35s 3.16s backwards}
      .handoff {animation:deliver .56s 3.62s backwards}
    }
    @keyframes arrive {from{opacity:0;transform:translate(14px,13px)}to{opacity:1;transform:translate(0,0)}}
    @keyframes ink {from{opacity:0}to{opacity:1}}
    @keyframes rank {from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes deliver {from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
    @media (prefers-reduced-motion:no-preference){.p0{animation-delay:0.12s}.p1{animation-delay:0.26s}.p2{animation-delay:0.40s}.p3{animation-delay:0.54s}.p4{animation-delay:0.68s}.p5{animation-delay:0.82s}.p6{animation-delay:0.96s}.p7{animation-delay:1.10s}.p8{animation-delay:1.24s}}
    .slip {opacity:0}
    @media (prefers-reduced-motion:no-preference){
      .slip {animation:pass .92s cubic-bezier(.3,.73,.39,1) both}
      .a {animation-delay:1.25s}.b {animation-delay:1.4s}.c {animation-delay:1.55s}
    }
    @keyframes pass {0%{opacity:0;transform:translate(-15px,var(--dy))}18%{opacity:1}78%{opacity:1}100%{opacity:0;transform:translate(46px,0)}}
    </style>
